name: Android local development preview

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-local-preview, codex/android-local-preview]
    paths:
      - 'mobile/android/**'
      - 'web/**'
      - 'skills/**'
      - 'desktop/build_starter.py'
      - 'scripts/build_local_web_preview.py'
      - '.github/workflows/android-local-preview.yml'

permissions:
  contents: read

concurrency:
  group: android-local-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: ${{ github.workspace }}/.cache/android-avd
      ANDROID_USER_HOME: ${{ github.workspace }}/.cache/android-user
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare pinned public offline runtime
        run: |
          npm install --prefix .cache/mobile-local-spike --cache .cache/mobile-local-spike/npm-cache --ignore-scripts --no-audit --no-fund pyodide@0.29.3
          node web/prepare-runtime.mjs
          node web/prepare-runtime.mjs --offline
          python mobile/android/prepare_assets.py
      - name: Bridge and public asset regressions
        run: |
          node --test mobile/android/test_bridge.cjs
          python mobile/android/test_assets.py
      - name: Build development APK and instrumentation APK
        run: |
          mkdir -p .cache/android-qa
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p mobile/android --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee .cache/android-qa/build.log
      - name: Prepare Android 35 emulator
        run: |
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name studio-ci --path "$ANDROID_AVD_HOME/studio-ci.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 --force
          # Keep command-line tools and the emulator on the same explicit AVD root.
          printf 'avd.ini.encoding=UTF-8\npath=%s/studio-ci.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" >"$ANDROID_AVD_HOME/studio-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx studio-ci
      - name: Actual WebView worker, analysis, rendering, local files and persistence
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb version
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd studio-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 >.cache/android-qa/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          booted=0
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat .cache/android-qa/emulator.log; exit 1; fi
            if adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then booted=1; break; fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then adb devices -l; cat .cache/android-qa/emulator.log; exit 1; fi
          # This fresh Google image's launcher can ANR during first-boot indexing.
          # Only that unrelated emulator Home package is disabled; app ANRs remain visible.
          if adb shell pm list packages com.google.android.apps.nexuslauncher | grep -q 'package:com.google.android.apps.nexuslauncher'; then
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
          fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb logcat -c
          adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
          adb install mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          set +e
          adb shell am instrument -w -e ciLauncherDisabled true -e class org.polishscifigures.studio.preview.LocalEngineInstrumentedTest org.polishscifigures.studio.preview.debug.test/androidx.test.runner.AndroidJUnitRunner | tee .cache/android-qa/instrumentation.log
          test_status=0
          grep -q 'OK (1 test)' .cache/android-qa/instrumentation.log || test_status=1
          if [ "$test_status" -eq 0 ]; then
            adb shell am force-stop org.polishscifigures.studio.preview.debug
            adb shell am instrument -w -e class org.polishscifigures.studio.preview.WorkspaceRestartInstrumentedTest org.polishscifigures.studio.preview.debug.test/androidx.test.runner.AndroidJUnitRunner | tee .cache/android-qa/process-restart.log
            grep -q 'OK (1 test)' .cache/android-qa/process-restart.log || test_status=1
          fi
          adb logcat -d >.cache/android-qa/logcat.txt
          adb pull /sdcard/Android/data/org.polishscifigures.studio.preview.debug/files/qa .cache/android-qa/runtime || true
          exit "$test_status"
      - name: Package development APK and checksums
        run: |
          mkdir -p .cache/android-qa/delivery
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk .cache/android-qa/delivery/Figure-Studio-Android-Local-Preview.apk
          cp mobile/android/README.md .cache/android-qa/delivery/README.md
          cp .cache/android-qa/runtime/android-runtime-proof.json .cache/android-qa/delivery/
          cp .cache/android-qa/runtime/android-process-restart-proof.json .cache/android-qa/delivery/
          cd .cache/android-qa/delivery
          sha256sum Figure-Studio-Android-Local-Preview.apk >SHA256SUMS.txt
      - name: Collect tested development APK
        uses: actions/upload-artifact@v4
        with:
          name: figure-studio-android-local-development-preview
          path: .cache/android-qa/delivery/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Collect synthetic test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figure-studio-android-diagnostics
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .cache/android-qa/*.log
            .cache/android-qa/*.txt
            .cache/android-qa/runtime/
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/androidTest-results/
