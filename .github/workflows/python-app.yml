name: Skill checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: skill-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  basic:
    name: basic (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Skill folders
        run: python scripts/validate_skill_structure.py
      - name: Check Python syntax
        run: python -m compileall -q sci_figures.py scripts skills demo
      - name: Unified CLI smoke test
        run: python test_sci_figures_cli.py
      - name: Gallery CLI UTF-8 and palette regression
        run: python scripts/test_gallery_cli_encoding.py
      - name: Figure Studio packaging and provenance
        run: python skills/polish-sci-figures/scripts/test_figure_studio.py
      - name: Desktop launcher lifecycle and local authorization
        run: |
          python desktop/test_figure_studio_app.py
          python desktop/test_windows_updater.py
          python desktop/test_macos_build.py
      - name: Local image duplicate screening and evidence
        run: |
          python scripts/test_image_duplicates.py
          python scripts/test_duplicate_integration.py
      - name: Release QA gates
        run: |
          python skills/polish-sci-figures/scripts/test_figure_text_qa.py
          python skills/polish-sci-figures/scripts/test_font_policy.py
          python skills/polish-sci-figures/scripts/test_check_source_portability.py
          python skills/polish-sci-figures/scripts/figure_accessibility_qa.py --self-test
          python scripts/test_qa_parsers.py
      - name: Validate skill behavior evals
        run: |
          python scripts/validate_skill_evals.py
          python scripts/test_skill_eval_scorer.py
      - name: Test Matplotlib runtime environment
        run: python scripts/test_runtime_env.py
      - name: Doctor
        run: python sci_figures.py doctor --font "DejaVu Sans"

  integration:
    name: full integration (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test raw-data figure workbench
        run: python skills/make-sci-data-figures/scripts/test_figure_workbench.py
      - name: Test relationship, timecourse, composition, and matrix families
        run: python skills/make-sci-data-figures/scripts/test_data_family_workbench.py
      - name: Validate complete 1-124 template routing
        run: python skills/polish-sci-figures/scripts/template_router.py self-check
      - name: Test advanced template families and palette-only rerendering
        run: python skills/make-sci-data-figures/scripts/test_advanced_template_workbench.py
      - name: Test scientific-image standardization
        run: python skills/standardize-sci-images/scripts/test_standardize_images.py
      - name: Check deterministic family example data
        run: |
          python skills/make-sci-data-figures/examples/make_family_examples.py
          git diff --exit-code -- skills/make-sci-data-figures/examples/synthetic_*.csv
      - name: Check deterministic advanced example data
        run: |
          python skills/make-sci-data-figures/examples/make_advanced_examples.py
          git diff --exit-code -- skills/make-sci-data-figures/examples/synthetic_*.csv
      - name: Build and test complete release bundle
        run: |
          python scripts/test_release_versions.py
          python scripts/build_release.py
          python scripts/test_release_bundle.py
          python scripts/build_portable_skill.py
          python scripts/test_portable_skill.py
      - name: Compute synthetic results for composite statistics layout
        # The Node layout test consumes these freshly analyzed observations.
        # A clean checkout must never depend on a developer's .cache contents.
        run: |
          python scripts/test_composite_statistics.py
          python scripts/test_interaction_stat_metadata.py
      - name: Figure Studio history and state validation
        run: |
          node scripts/test_studio_browser_transport.cjs
          node scripts/test_studio_native_download.cjs
          node scripts/test_studio_mobile_ui.cjs
          node scripts/test_local_web_engine.cjs
          node scripts/test_local_web_offline.cjs
          node scripts/test_studio_state.cjs
          node scripts/test_studio_duplicate_check.cjs
          node scripts/test_studio_duplicate_review.cjs
          node scripts/test_studio_duplicate_viewer.cjs
          node scripts/test_studio_header_menu.cjs
          node scripts/test_studio_delete_labels.cjs
          node scripts/test_studio_keyboard_nudge.cjs
          node scripts/test_studio_new_project.cjs
          node scripts/test_studio_beginner_flow.cjs
          node scripts/test_studio_easy_statistics.cjs
          node scripts/test_studio_statistical_line_editing.cjs
          node scripts/test_studio_grouped_stat_layout.cjs
          node scripts/test_studio_interaction_statistics.cjs
          node scripts/test_studio_annotation_pane.cjs
          node scripts/test_studio_statistical_metadata.cjs
          node scripts/test_studio_literature.cjs
          node scripts/test_studio_variant_switch.cjs
          node scripts/test_studio_stat_layout.cjs
          node scripts/test_studio_composite_stat_layout.cjs
          node scripts/test_studio_workspace_selection.cjs
          node scripts/test_studio_selection_transform.cjs
          node scripts/test_studio_selection_commands.cjs
          node scripts/test_studio_panel_delete.cjs
          node scripts/test_studio_heatmap_palettes.cjs
          node scripts/test_studio_swatch_schemes.cjs
          node scripts/test_studio_insert_inline.cjs
          node scripts/test_studio_line_controls.cjs
          node scripts/test_studio_svg_content.cjs
          node scripts/test_studio_positioned_text.cjs
          node scripts/test_studio_mark_styles.cjs
          node scripts/test_studio_mark_controls.cjs
          node scripts/test_studio_rich_text_regression.cjs
          node scripts/test_studio_data_text_preservation.cjs
          node scripts/test_studio_data_validation.cjs
          node scripts/test_studio_tiff_export.cjs
          node scripts/test_studio_panel_export.cjs
          node scripts/test_studio_panel_gaps.cjs
          node scripts/test_studio_compact_whitespace.cjs
          node scripts/test_studio_compact_interactions.cjs
      - name: Category spacing metadata and editable group geometry
        # The SVG geometry tests consume these fresh canonical legacy assets.
        run: |
          python scripts/test_legacy_group_metadata.py
          node scripts/test_studio_group_spacing.cjs
          node scripts/test_studio_group_spacing_controls.cjs
          python scripts/build_group_spacing_fixtures.py
          node scripts/test_studio_group_spacing_gallery.cjs
      - name: Figure Studio analysis and data reflow
        run: |
          python scripts/test_studio_statistics.py
          python scripts/test_studio_updates.py
          python scripts/test_studio_image_links.py
          python scripts/test_studio_image_links_endpoint.py
          python scripts/test_studio_mark_styles.py
          python scripts/test_grouped_stat_metadata.py
          python scripts/test_studio_pdf.py
          python scripts/test_studio_pdf_endpoint.py
          python scripts/test_studio_reflow.py
          python scripts/test_studio_axes_regression.py
      - name: Whitespace check
        run: git diff --check

  browser-preview:
    name: local browser preview (ubuntu, py3.12, Node24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up tested Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned public runtime and DOM test dependencies
        run: npm install --prefix .cache/mobile-local-spike --cache .cache/mobile-local-spike/npm-cache --ignore-scripts --no-audit --no-fund --save-exact pyodide@0.29.3 jsdom@26.1.0
      - name: Cache official scientific wheels
        uses: actions/cache@v4
        with:
          path: .cache/mobile-local-spike/node_modules/pyodide/*.whl
          key: ${{ runner.os }}-pyodide-0.29.3-wheels-${{ hashFiles('web/prepare-runtime.mjs') }}
      - name: Prepare and verify pinned public assets
        run: |
          node web/prepare-runtime.mjs
          node web/prepare-runtime.mjs --offline
      - name: Build browser preview from this checkout
        run: |
          python scripts/build_local_web_preview.py
          python scripts/test_local_web_build.py
      - name: Execute actual WASM dispatcher with network forbidden
        run: |
          node scripts/test_local_web_wasm.mjs
          node scripts/test_studio_image_links_wasm.mjs
      - name: Mobile DOM integration (simulation, not device validation)
        env:
          NODE_PATH: ${{ github.workspace }}/.cache/mobile-local-spike/node_modules
        run: |
          node scripts/test_studio_text_geometry.cjs
          node scripts/test_studio_pdf_text_editing.cjs
          node scripts/test_studio_selection_transform_dom.cjs
          node scripts/test_studio_selection_resize_integration.cjs
          node scripts/test_studio_selection_performance.cjs
          node scripts/test_studio_axis_editing.cjs --dom --real
          node scripts/test_studio_component_style.cjs --dom --real
          node scripts/test_studio_component_controls.cjs --dom
          node scripts/test_studio_grid_resize.cjs --dom
          node scripts/test_studio_statistical_line_geometry.cjs
          node scripts/test_studio_grid_resize.cjs --dom
          node scripts/test_studio_direct_text_editing.cjs
          node scripts/test_studio_canvas_clipboard.cjs
          node scripts/test_studio_canvas_clipboard_integration.cjs
          node scripts/test_studio_file_import.cjs
          node scripts/test_studio_resize_text.cjs
          node scripts/test_studio_panel_delete.cjs --dom
          node scripts/test_mobile_dom_preview.cjs
          node scripts/test_studio_mark_styles.cjs --dom
          node scripts/test_studio_mark_controls.cjs --dom
          node scripts/test_studio_image_insets.cjs --dom
          node scripts/test_studio_image_color.cjs --dom
          node scripts/test_studio_image_color_ui.cjs
          node scripts/test_studio_image_color_roundtrip.cjs
          node scripts/test_studio_image_links.cjs --dom
          node scripts/test_studio_image_links_ui.cjs
          node scripts/test_studio_image_links_controller.cjs
          node scripts/test_studio_image_insets_ui.cjs
          node scripts/test_studio_image_insets_controller.cjs
          node scripts/test_studio_image_insets_integration.cjs
          node scripts/test_studio_update_check.cjs --dom
          node scripts/test_studio_update_install.cjs --dom
          node scripts/test_studio_update_transport.cjs
          node scripts/test_studio_compact_whitespace.cjs --dom
      - name: Retain synthetic calculation evidence and public-file checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-preview-checks
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .cache/local-web-qa/wasm-dispatcher.json
            .cache/local-web-preview/SHA256SUMS.txt
