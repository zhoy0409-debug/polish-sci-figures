          node scripts/test_studio_compact_whitespace.cjs --dom
      - name: Prepare pinned Chromium for controlled update UI checks
        run: node .cache/mobile-local-spike/node_modules/playwright/cli.js install --with-deps chromium
      - name: Native TIFF display, retained sources, project Worker and submission profiles in real browser
        env:
          NODE_PATH: ${{ github.workspace }}/.cache/mobile-local-spike/node_modules
          STUDIO_TIFF_BROWSER: chromium
        run: python scripts/run_studio_tiff_browser_checks.py --out .cache/native-tiff-browser-checks
      - name: Update scene real browser rendering and lifecycle (controlled states)
        env:
          NODE_PATH: ${{ github.workspace }}/.cache/mobile-local-spike/node_modules
          STUDIO_SCENE_BROWSER: chromium
          STUDIO_SCENE_PROOF: .cache/update-scene-ci
        run: node scripts/test_studio_update_scene_browser.cjs
      - name: Retain synthetic calculation evidence and public-file checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-preview-checks
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .cache/local-web-qa/wasm-dispatcher.json
            .cache/local-web-preview/SHA256SUMS.txt
            .cache/update-scene-ci/
            .cache/native-tiff-browser-checks/
